user nginx;
worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 256; }
stream {
  server { listen 5545; proxy_pass pilot-server:5545; }
}
http {
  client_max_body_size 2g;
  map $http_upgrade $pilot_connection_upgrade { default upgrade; '' close; }
  map $http_x_forwarded_proto $pilot_forwarded_proto { default $http_x_forwarded_proto; '' $scheme; }
  access_log off;
  server {
    listen 80;
    location / {
      proxy_pass http://pilot-web-server:80;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $pilot_connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $pilot_forwarded_proto;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
      proxy_buffering off;
      proxy_request_buffering off;
    }
  }
  server {
    listen 5200;
    location / {
      proxy_pass http://pilot-web-myadmin:5200;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $pilot_connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $pilot_forwarded_proto;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
      proxy_buffering off;
    }
  }
}
