events {worker_connections 256;} http {map $http_upgrade $connection_upgrade {default upgrade; '' close;} server {listen 8080;location / {proxy_pass http://broken:80;proxy_http_version 1.1;proxy_set_header Upgrade $http_upgrade;proxy_set_header Connection $connection_upgrade;proxy_set_header Host $http_host;proxy_set_header X-Forwarded-Host $http_host;proxy_set_header X-Forwarded-Proto https;}} server {listen 8081;location / {proxy_pass http://fixed:80;proxy_http_version 1.1;proxy_set_header Upgrade $http_upgrade;proxy_set_header Connection $connection_upgrade;proxy_set_header Host $http_host;proxy_set_header X-Forwarded-Host $http_host;proxy_set_header X-Forwarded-Proto https;}}}